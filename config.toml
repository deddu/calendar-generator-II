# Calendar render config. Override per-run with --config some_other.toml.

dpi = 300                          # 72/96 screen, 300 print
page_mm = [1189, 841]              # A0 landscape, [width, height]

[fonts]
dir = "/Users/dre/Dropbox/design/fonts/Lato"
# point sizes, scaled to dpi at render time
sizes = { year = 60, month = 28, dom = 28, dow = 22, holiday = 12 }

[color]
# light teal to match the house decor. National holidays draw a colored
# inner frame inset from the cell border (solid for IT, dashed for US) so
# they read distinctly from a plain teal weekend; a holiday-on-weekend shows
# fill + frame.
weekend = [161, 224, 224]
holiday_frame = 0.04   # inner frame thickness, fraction of cell width (~4%)
holiday_inset = 0.05   # gap between cell border and the holiday frame

# Each country adds a holiday border + a DST marker. border_style = "solid"
# or "dashed"; when two countries share a day, solid is drawn first and
# dashed overlaid so both show.
[[country]]
code = "IT"
timezone = "Europe/Rome"
color = [149, 191, 191]
prefix = ""          # text prefix before the holiday name
border_style = "solid"

[[country]]
code = "US"
timezone = "America/Chicago"
color = [179, 216, 209]
prefix = "US - "
border_style = "dashed"
